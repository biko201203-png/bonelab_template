name: Build BONELAB Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile Mod
      run: msbuild bonelab_template.csproj /p:Configuration=Release

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: FusionStatsNametags
        path: '**/FusionStatsNametags.dll'
