name: Build BONELAB Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore Project Dependencies
      run: dotnet restore bonelab_template.csproj

    - name: Compile Mod
      run: dotnet build bonelab_template.csproj -c Release

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: FusionStatsNametags
        path: bin/Release/net472/FusionStatsNametags.dll
