name: Build BONELAB Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile Mod
      run: |
        csc /target:library /out:FusionStatsNametags.dll /reference:References\BoneLib.dll /reference:References\Unity.TextMeshPro.dll Main.cs

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: FusionStatsNametags
        path: FusionStatsNametags.dll
